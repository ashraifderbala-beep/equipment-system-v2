# يمنع إيقاف مشروع Supabase المجاني بسبب عدم النشاط (يرسل طلب قراءة صغير كل يوم).
# ضعه في GitHub بالمسار: .github/workflows/keepalive.yml
# لو فشل الطلب (مثلاً المشروع متوقف) يظهر التشغيل بالأحمر ويصلك إيميل من GitHub.
name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 * * *'     # يومياً 6 صباحاً بتوقيت UTC
  workflow_dispatch:         # يتيح تشغيله يدوياً من تبويب Actions

