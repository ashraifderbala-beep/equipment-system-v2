<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef0f3; --border:#dfe3e8;
  --text:#1c2126; --text-dim:#5b6470; --primary:#0f6e5f; --primary-dim:#0a4f44;
  --accent:#c17a1f; --danger:#b3261e; --ok:#1e8e3e; --warn:#b3261e;
  --pending:#8a6d00; --shadow: 0 1px 3px rgba(0,0,0,.08);
  --font: 'Segoe UI', Tahoma, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171a; --surface:#1c2024; --surface-2:#22262b; --border:#33383e;
    --text:#e8eaed; --text-dim:#9aa3ab; --primary:#3fb89a; --primary-dim:#2a8f76;
    --accent:#e0a350; --danger:#f2867d; --ok:#6bcf8a; --warn:#f2867d; --pending:#e0c05a;
  }
}
:root[data-theme="dark"]{
  --bg:#14171a; --surface:#1c2024; --surface-2:#22262b; --border:#33383e;
  --text:#e8eaed; --text-dim:#9aa3ab; --primary:#3fb89a; --primary-dim:#2a8f76;
  --accent:#e0a350; --danger:#f2867d; --ok:#6bcf8a; --warn:#f2867d; --pending:#e0c05a;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
#app{max-width:1200px;margin:0 auto;padding:14px;}
h1,h2,h3{margin:.2em 0;}
a{color:var(--primary);}
button{font-family:var(--font);cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-size:14px;background:var(--primary);color:#fff;transition:.15s;}
button:hover{filter:brightness(1.08);}
button.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
button.danger{background:var(--danger);color:#fff;}
button.small{padding:5px 10px;font-size:12.5px;border-radius:6px;}
button:disabled{opacity:.5;cursor:not-allowed;}
input,select,textarea{font-family:var(--font);background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;width:100%;}
textarea{min-height:70px;resize:vertical;}
label{display:block;font-size:13px;color:var(--text-dim);margin:10px 0 4px;font-weight:600;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>*{flex:1;min-width:180px;}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo{font-size:28px;}
.userchip{background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;display:flex;align-items:center;gap:8px;}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px;}
nav button{background:transparent;color:var(--text-dim);border:1px solid transparent;}
nav button.active{background:var(--primary);color:#fff;}
nav button:not(.active):hover{background:var(--surface-2);color:var(--text);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);}
th{color:var(--text-dim);font-weight:600;background:var(--surface-2);position:sticky;top:0;}
tr:hover td{background:var(--surface-2);}
.tablewrap{overflow-x:auto;max-height:65vh;overflow-y:auto;border:1px solid var(--border);border-radius:10px;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;}
.b-working{background:#1e8e3e22;color:var(--ok);}
.b-repair{background:#b3261e22;color:var(--danger);}
.b-pending{background:#b3900022;color:var(--pending);}
.b-scrap{background:#66666622;color:var(--text-dim);}
.b-approved{background:#1e8e3e22;color:var(--ok);}
.b-rejected{background:#b3261e22;color:var(--danger);}
.b-workshop{background:#0f6e5f22;color:var(--primary);}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.stat b{font-size:26px;display:block;color:var(--primary);}
.stat span{font-size:12.5px;color:var(--text-dim);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50;}
.modal{background:var(--surface);border-radius:14px;padding:20px;max-width:720px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);}
.modal h2{margin-top:0;}
.closebtn{float:left;background:var(--surface-2);color:var(--text);border-radius:50%;width:30px;height:30px;padding:0;}
.timeline{border-right:2px solid var(--border);padding-right:16px;margin-right:6px;}
.tl-item{position:relative;padding-bottom:16px;}
.tl-item::before{content:'';position:absolute;right:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--primary);}
.hint{font-size:12px;color:var(--text-dim);margin-top:2px;}
.req{color:var(--danger);}
.loginwrap{min-height:90vh;display:flex;align-items:center;justify-content:center;}
.loginbox{max-width:420px;width:100%;text-align:center;}
.loginbox .logo{font-size:52px;}
footer{text-align:center;color:var(--text-dim);font-size:12px;margin:20px 0;}
.tabs2{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.tabs2 button{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.tabs2 button.active{background:var(--primary-dim);color:#fff;border-color:var(--primary-dim);}
.empty{text-align:center;color:var(--text-dim);padding:30px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:640px){.two-col{grid-template-columns:1fr;}}
.imgprev{max-width:100%;max-height:160px;border-radius:8px;margin-top:6px;border:1px solid var(--border);}
.muted{color:var(--text-dim);font-size:12.5px;}
.section-title{font-size:15px;font-weight:700;margin:16px 0 8px;color:var(--primary);}
@media print{
  body.print-modal-only #app > *:not(.modal-bg){display:none !important;}
  body.print-modal-only .modal-bg{position:static;background:none;padding:0;display:block;}
  body.print-modal-only .modal{box-shadow:none;max-width:100%;}
  body.print-modal-only .closebtn, body.print-modal-only .noprint{display:none !important;}
  body.print-report-only nav, body.print-report-only .top, body.print-report-only footer, body.print-report-only .noprint{display:none !important;}
}
</style>
</head>

function fmtDate(iso){
  if(!iso) return '—';
  try{ const d=new Date(iso); return d.toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'}); }catch(e){return iso;}
}
function fmtDateTime(iso){
  if(!iso) return '—';
  try{ const d=new Date(iso); return d.toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'})+' '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); }catch(e){return iso;}
}
function daysBetween(a,b){
  if(!a) return null;
  const d1=new Date(a), d2=b?new Date(b):new Date();
  return Math.max(0, Math.round((d2-d1)/86400000));
}
function statusBadgeClass(s){
  if(!s) return '';
  if(s.includes('Repair') || s.includes('اصلاح')) return 'b-repair';
  if(s.includes('Scrap') || s.includes('Total Loss')) return 'b-scrap';
  if(s.includes('Working')||s.includes('Ready')) return 'b-working';
  return 'b-pending';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function uniqueLocations(){

  EQUIPMENT_SEED.forEach(e=>{ if(e.project && !JUNK_LOCATIONS.has(e.project)) set.add(e.project); });
  set.add(WORKSHOP_CAPITAL); set.add(WORKSHOP_SUEZ);
  return Array.from(set).sort((a,b)=>a.localeCompare('ar'));
}

// ---------- SUPABASE DATA LAYER ----------
async function fetchAll(){
  const [eqRes, trRes, prRes] = await Promise.all([
    sb.from('equipment').select('*'),
    sb.from('transfers').select('*').order('requested_at',{ascending:false}),
    sb.from('projects').select('*')
  ]);
  if(eqRes.error) console.error(eqRes.error);
  if(trRes.error) console.error(trRes.error);
  if(prRes.error) console.warn('projects table not found yet - run migration_2 sql', prRes.error);
  equipmentMap = {};
  (eqRes.data||[]).forEach(r=>{ equipmentMap[r.code] = eqFromRow(r); });
  transfersMap = {};
  (trRes.data||[]).forEach(r=>{ transfersMap[r.id] = trFromRow(r); });
  customProjects = (prRes.data||[]).map(r=>r.name);
}
function eqFromRow(r){
  return {id:r.code, code:r.code, name:r.name, brand:r.brand, model:r.model, category:r.category, year:r.year,
    license:r.license, project:r.project, locationType:r.location_type, status:r.status, chassis:r.chassis,
    eng:r.eng, driver:r.driver, transferCount:r.transfer_count, lastMoveAt:r.last_move_at,
    lastMaintenanceDate:r.last_maintenance_date, lastMaintenanceMeter:r.last_maintenance_meter,
    lastFilterChanged:r.last_filter_changed, accessories:r.accessories, photoAssetUrl:r.photo_url};
}
function trFromRow(r){
  return {id:r.id, equipmentCode:r.equipment_code, equipmentName:r.equipment_name, transferType:r.transfer_type,
    fromLocation:r.from_location, fromLocationType:r.from_location_type, toLocation:r.to_location, toLocationType:r.to_location_type,
    requestedBy:r.requested_by, requestedAt:r.requested_at, status:r.status, approvedBy:r.approved_by, approvedAt:r.approved_at,
    approvalNotes:r.approval_notes, partsAndSpares:r.parts_and_spares, photoAssetUrl:r.photo_url,
    lastMaintenanceDate:r.last_maintenance_date, lastMaintenanceMeter:r.last_maintenance_meter, lastFilterChanged:r.last_filter_changed,
    accessories:r.accessories, missionEndDate:r.mission_end_date, inspectionFormUrl:r.inspection_form_url,
    entryDate:r.entry_date, exitDate:r.exit_date, workDone:r.work_done, workShouldBeDone:r.work_should_be_done,
    technicalNotes:r.technical_notes, invoices:r.invoices||[], labor:r.labor||[], parts:r.parts||[],
    reportLocked:r.report_locked||false, lockedBy:r.locked_by, lockedAt:r.locked_at};
}
async function ensureSeed(){
  const {count, error} = await sb.from('equipment').select('*', {count:'exact', head:true});
  if(error){ console.error(error); return; }
  if(count && count>0) return;
  const rows = EQUIPMENT_SEED.map(item=>({
    code:item.code, name:item.name, brand:item.brand, model:item.model, category:item.category,
    year:item.year, license:item.license, project:item.project, location_type: locType(item.project),
    status:item.status, chassis:item.chassis, eng:item.eng, driver:item.driver, transfer_count:0
  }));
  for(let i=0;i<rows.length;i+=200){
    const chunk = rows.slice(i,i+200);
    const {error:e2} = await sb.from('equipment').upsert(chunk, {onConflict:'code'});
    if(e2) console.error(e2);
  }
  try{
    const {count} = await sb.from('projects').select('*', {count:'exact', head:true});
    if(!count){
      const projRows = PROJECT_LOCATIONS.map(name=>({name}));
      await sb.from('projects').upsert(projRows, {onConflict:'name'});
    }
  }catch(e){ console.warn('projects table missing - run migration_2 sql', e); }
}
function subscribeRealtime(){
  sb.channel('eq-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'equipment'}, async ()=>{ await fetchAll(); render(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'transfers'}, async ()=>{
      const oldMap = transfersMap;
      await fetchAll();
      detectTransferNotifications(oldMap, transfersMap);
      render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'projects'}, async ()=>{ await fetchAll(); render(); })
    .subscribe();
}

function isEmailConfigured(){
  return window.emailjs && !EMAILJS_SERVICE_ID.startsWith('YOUR_') && !EMAILJS_TEMPLATE_ID.startsWith('YOUR_') && !EMAILJS_PUBLIC_KEY.startsWith('YOUR_');
}
function sendAdminEmail(subject, message){
  // هذه الدالة "أفضل مجهود" فقط: أي فشل فيها لا يوقف أو يعطّل أي عملية أخرى في النظام
  if(!isEmailConfigured()) return;
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  (ADMIN_NOTIFY_EMAILS||[]).forEach(email=>{
    const clean = (email||'').trim();
    if(!clean || !emailRegex.test(clean)) return;          // تجاهل أي عنوان غير صالح الشكل
    if(clean.endsWith('.local') || clean.endsWith('@example.com')) return; // تجاهل أي عنوان وهمي بنطاق غير حقيقي
    try{
      // ملاحظة مهمة: لا نرسل أي حقل "email" وهمي بنطاق .local، لأنه يُستخدم غالباً
      // كعنوان "Reply-To" داخل قالب EmailJS، ونطاق .local غير موجود فعلياً على الإنترنت،
      // فيرفضه خادم البريد ويُعيد رسالة فشل تسليم (Bounce) لنفس حساب المرسل.
      // بترك الحقل بدون قيمة، يستخدم EmailJS تلقائياً بريد الحساب الحقيقي المتصل بالخدمة.
      emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        to_email: clean,
        subject: subject,
        message: message,
        name: 'نظام متابعة ونقل المعدات'
      }).catch(err=>console.warn('تعذر إرسال إيميل التنبيه إلى', clean, err));
    }catch(err){ console.warn('emailjs send error', err); }
  });
}

// ---------- NOTIFICATIONS ----------
let notifications = [];
function isMe(locationName){ return currentUser && currentUser.name === locationName; }
function addNotification(text, tab){
  notifications.unshift({id: Date.now()+'_'+Math.random(), text, tab, at:new Date().toISOString(), seen:false});
  notifications = notifications.slice(0,50);
  renderNotifBell();
  playNotifSound();
  if(document.hidden) showBrowserNotification(text);
}
function detectTransferNotifications(oldMap, newMap){
  if(!currentUser) return;
  Object.values(newMap).forEach(t=>{
    const old = oldMap[t.id];
    if(!old){
      if(t.status==='pending' && currentUser.role==='admin'){
        addNotification(`📥 طلب نقل جديد: ${t.equipmentName} (${t.fromLocation} ← ${t.toLocation})`, 'approvals');
      }
      return;
    }
    if(old.status===t.status) return;
    if((t.status==='approved' || t.status==='in_workshop') && isMe(t.toLocation)){
      addNotification(`✅ تمت الموافقة على استلام معدة: ${t.equipmentName}`, 'transfers');
    }
    if(t.status==='rejected' && isMe(t.fromLocation)){
      addNotification(`❌ تم رفض طلب نقل: ${t.equipmentName}`, 'transfers');
    }
    if(t.status==='ready_return' && currentUser.role==='admin'){
      addNotification(`🔧 طلب إعادة معدة من الورشة بانتظار الموافقة: ${t.equipmentName}`, 'approvals');
    }
    if(t.status==='completed' && isMe(t.fromLocation)){
      addNotification(`🔄 عادت معدتك من الورشة: ${t.equipmentName}`, 'transfers');
    }
  });
}
function playNotifSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 150);
  }catch(e){}
}
function showBrowserNotification(text){
  try{
    if(window.Notification && Notification.permission==='granted'){
      new Notification('نظام متابعة ونقل المعدات', {body:text, icon:'🚜'});
    }
  }catch(e){}
}
function requestNotifPermission(){
  if(!window.Notification){ alert('متصفحك لا يدعم تنبيهات النظام'); return; }
  Notification.requestPermission().then(p=>{
    if(p==='granted') alert('تم تفعيل تنبيهات المتصفح بنجاح ✅');
    render();
  });
}
function renderNotifBell(){
  const bell = document.getElementById('notifBellCount');
  if(!bell) return;
  const unread = notifications.filter(n=>!n.seen).length;
  bell.style.display = unread? '' : 'none';
  bell.textContent = unread>9 ? '9+' : unread;
}
function openNotifModal(){
  notifications.forEach(n=>n.seen=true);
  renderNotifBell();
  const modal = document.createElement('div'); modal.className='modal-bg';
  const permBtn = (window.Notification && Notification.permission!=='granted') ? `<button class="small secondary noprint" onclick="requestNotifPermission()">🔔 تفعيل تنبيهات المتصفح</button>` : '';
  modal.innerHTML = `<div class="modal"><button class="closebtn" onclick="this.closest('.modal-bg').remove()">✕</button>
    <h2>الإشعارات</h2>
    ${permBtn}
    <div style="margin-top:10px;">
    ${notifications.length? notifications.map(n=>`
      <div class="tl-item" style="cursor:pointer;" onclick="setTab('${n.tab}');this.closest('.modal-bg').remove();">
        <div>${esc(n.text)}</div>
        <div class="muted">${fmtDateTime(n.at)}</div>
      </div>`).join('') : '<div class="empty">لا توجد إشعارات بعد</div>'}
    </div>
  </div>`;
  document.body.appendChild(modal);
}
async function uploadFile(file, prefix){
  const path = prefix + '/' + Date.now() + '_' + file.name.replace(/[^A-Za-z0-9_.-]/g,'_');
  const {error} = await sb.storage.from('equipment-files').upload(path, file);
  if(error) throw error;
  const {data} = sb.storage.from('equipment-files').getPublicUrl(path);
  return data.publicUrl;
}

function transferList(){ return Object.values(transfersMap).sort((a,b)=>(b.requestedAt||'').localeCompare(a.requestedAt||'')); }

    return;
  }
  if(!currentUser){
    try{
      const {data} = await sb.from('projects').select('*');
      customProjects = (data||[]).map(r=>r.name);
    }catch(e){ /* projects table may not exist yet - fine */ }
    renderLogin();
    return;
  }
  app.innerHTML = '<div class="empty">جارِ تحميل البيانات...</div>';
  try{
    try{ await ensureSeed(); }catch(seedErr){ console.warn('seed skipped', seedErr); }
    await fetchAll();
    subscribeRealtime();
    render();
  }catch(e){
    console.error(e);
    app.innerHTML = '<div class="card empty">تعذر الاتصال بقاعدة البيانات. تحقق من إعدادات SUPABASE_URL / ANON_KEY وسياسات RLS.</div>';
  }
}

function typeLabel(t){ return {permanent:'نقل دائم', mission:'مأمورية', repair:'نقل للإصلاح'}[t] || t; }
function transferStatusBadge(t){
  const map = {pending:['قيد الانتظار','b-pending'], approved:['معتمد','b-approved'], rejected:['مرفوض','b-rejected'],
    in_workshop:['داخل الورشة','b-workshop'], ready_return:['جاهز للعودة - بانتظار الموافقة','b-pending'], completed:['مكتمل','b-approved']};
  const [label,cls] = map[t.status] || [t.status,''];
  return `<span class="badge ${cls}">${label}</span>`;
}

async function unlockReport(id){
  if(!confirm('فتح القفل يسمح بتعديل بيانات العمالة والقطع لهذا التقرير مرة أخرى. متابعة؟')) return;
  const {error} = await sb.from('transfers').update({report_locked:false}).eq('id', id);
  if(error){ alert('حدث خطأ: '+error.message); return; }
  await fetchAll(); render();
  document.querySelectorAll('.modal-bg').forEach(m=>m.remove());
}
async function decideTransfer(id, approve){
  const t = transfersMap[id]; if(!t) return;
  const notes = document.getElementById('notes_'+id)?.value.trim() || '';
  if(!approve && !notes){ alert('يرجى كتابة سبب الرفض'); return; }
  if(!approve){
    const {error} = await sb.from('transfers').update({status:'rejected', approved_by: currentUser.name, approved_at:new Date().toISOString(), approval_notes:notes}).eq('id', id);
    if(error){ alert('حدث خطأ: '+error.message); return; }
    await fetchAll(); render(); return;
  }
  const isReturn = t.status==='ready_return';
  const destLocation = isReturn ? t.fromLocation : t.toLocation;
  const destType = isReturn ? t.fromLocationType : t.toLocationType;
  const eqData = equipmentMap[t.equipmentCode] || {};
  let newStatus = eqData.status;
  if(isReturn) newStatus = 'Working';
  else if(t.transferType==='repair') newStatus = 'تحت الإصلاح';
  const {error:e1} = await sb.from('equipment').update({
    project: destLocation, location_type: destType, status: newStatus,
    transfer_count: (eqData.transferCount||0)+1, last_move_at: new Date().toISOString()
  }).eq('code', t.equipmentCode);
  if(e1){ alert('تعذر تحديث بيانات المعدة (تأكد من تسجيل الدخول كإدارة): '+e1.message); return; }
  const newTrStatus = isReturn ? 'completed' : (t.transferType==='repair' ? 'in_workshop' : 'approved');
  const trPatch = {status:newTrStatus, approved_by: currentUser.name, approved_at:new Date().toISOString(), approval_notes:notes};
  if(isReturn){
    // اعتماد نهائي لإعادة المعدة = قفل تقرير الورشة نهائياً (يحمي بيانات العمالة والحوافز من أي تعديل لاحق)
    trPatch.report_locked = true;
    trPatch.locked_by = currentUser.name;
    trPatch.locked_at = new Date().toISOString();
  }
  const {error:e2} = await sb.from('transfers').update(trPatch).eq('id', id);
  if(e2){ alert('حدث خطأ: '+e2.message); return; }
  await fetchAll(); render();
}

let workEditState = {}; // {transferId: {labor:[{name,role,hours,rate}], parts:[{name,qty,price}]}}
function ensureWorkState(t){
  if(!workEditState[t.id]){
    workEditState[t.id] = {
      labor: (t.labor||[]).map(x=>({name:x.name||'', role:x.role||'', hours:x.hours||'', rate:x.rate||''})),
      parts: (t.parts||[]).map(x=>({name:x.name||'', qty:x.qty||'', price:x.price||''}))
    };
  }
  return workEditState[t.id];
}
function costLine(hours, rate){ const h=parseFloat(hours)||0, r=parseFloat(rate)||0; return h*r; }
function costLine2(qty, price){ const q=parseFloat(qty)||0, p=parseFloat(price)||0; return q*p; }
function isWorkshopEditLocked(t){
  if(t.status==='in_workshop') return false;
  if(t.status==='completed') return !!t.reportLocked; // مقفول فقط لو تم الاعتماد النهائي فعلياً
  return true; // ready_return أو غيرها: بانتظار قرار الإدارة، غير قابل للتعديل من الورشة
}
function calcTotals(state){
  const laborTotal = state.labor.reduce((s,x)=>s+costLine(x.hours,x.rate),0);
  const partsTotal = state.parts.reduce((s,x)=>s+costLine2(x.qty,x.price),0);
  return {laborTotal, partsTotal, grand: laborTotal+partsTotal};
}
function renderLaborRows(id){
  const state = workEditState[id];
  const box = document.getElementById('laborRows_'+id);
  if(!box) return;
  const t = transfersMap[id]; const done = t && isWorkshopEditLocked(t);
  if(done){
    box.innerHTML = state.labor.length ? state.labor.map(row=>`<div class="muted" style="padding:3px 0;">${esc(row.name)} — ${esc(row.role)||'—'} — ${row.hours||0} ساعة × ${row.rate||0} = <b>${costLine(row.hours,row.rate).toLocaleString()}</b></div>`).join('') : '<div class="muted">لا يوجد</div>';
    updateCostSummary(id); return;
  }
  box.innerHTML = state.labor.map((row,i)=>`
    <div class="row" style="margin-top:6px;">
      <input placeholder="اسم الفني" value="${esc(row.name)}" onchange="updateLabor('${id}',${i},'name',this.value)">
      <input placeholder="الوظيفة (فني ميكانيكا، كهربائي...)" list="jobRoles" value="${esc(row.role)}" onchange="updateLabor('${id}',${i},'role',this.value)">
      <input type="number" min="0" step="0.5" placeholder="عدد الساعات" value="${esc(row.hours)}" onchange="updateLabor('${id}',${i},'hours',this.value)">
      <input type="number" min="0" step="1" placeholder="تكلفة الساعة" value="${esc(row.rate)}" onchange="updateLabor('${id}',${i},'rate',this.value)">
      <button class="small danger" style="flex:0 0 auto;" onclick="removeLabor('${id}',${i})">✕</button>
    </div>`).join('');
  updateCostSummary(id);
}
function renderPartsRows(id){
  const state = workEditState[id];
  const box = document.getElementById('partsRows_'+id);

async function saveWorkshopReport(id){
  const entryDate = document.getElementById('wentry_'+id).value;
  const exitDate = document.getElementById('wexit_'+id).value;
  const workDone = document.getElementById('wdone_'+id).value.trim();
  const workShouldBeDone = document.getElementById('wshould_'+id).value.trim();
  const technicalNotes = document.getElementById('wnotes_'+id).value.trim();
  const fileInput = document.getElementById('winvoice_'+id);
  const state = workEditState[id] || {labor:[], parts:[]};
  const labor = state.labor.filter(x=>x.name && x.name.trim()).map(x=>({name:x.name.trim(), role:(x.role||'').trim(), hours:parseFloat(x.hours)||0, rate:parseFloat(x.rate)||0}));
  const parts = state.parts.filter(x=>x.name && x.name.trim()).map(x=>({name:x.name.trim(), qty:parseFloat(x.qty)||0, price:parseFloat(x.price)||0}));
  const patch = {entry_date:entryDate, exit_date:exitDate, work_done:workDone, work_should_be_done:workShouldBeDone, technical_notes:technicalNotes, labor, parts};
  if(fileInput && fileInput.files[0]){
    try{
      const url = await uploadFile(fileInput.files[0], 'invoices');
      const t = transfersMap[id];
      const invoices = (t.invoices||[]).concat([{url, desc:'فاتورة', at:new Date().toISOString()}]);
      patch.invoices = invoices;
    }catch(e){ alert('تعذر رفع الملف: '+e.message); }
  }
  const {error} = await sb.from('transfers').update(patch).eq('id', id);
  if(error){ alert('حدث خطأ: '+error.message); return; }
  await fetchAll(); render();
  alert('تم الحفظ');
}
async function finishRepair(id){
  await saveWorkshopReport(id);
  if(!confirm('سيتم إرسال طلب إعادة المعدة للإدارة للموافقة. متابعة؟')) return;
  const t = transfersMap[id];
  const patch = {status:'ready_return'};
  if(!t.exitDate) patch.exit_date = new Date().toISOString().slice(0,10);
  const {error} = await sb.from('transfers').update(patch).eq('id', id);
  if(error){ alert('حدث خطأ: '+error.message); return; }
  try{
    sendAdminEmail(
      `طلب إعادة معدة من الورشة: ${t.equipmentName}`,
      `الورشة "${currentUser.name}" أنهت إصلاح المعدة وتطلب إعادتها للمشروع.\n\nالمعدة: ${t.equipmentName} (${t.equipmentCode})\nستعود إلى: ${t.fromLocation}\n\nيرجى الدخول للنظام لاعتماد إعادة المعدة.`
    );
  }catch(mailErr){ console.warn('email notify failed (ignored)', mailErr); }
  await fetchAll(); render();
}

function renderReports(){
  const eq = equipList();
  const tr = transferList();
  const byType = {permanent:0, mission:0, repair:0};
  tr.forEach(t=> byType[t.transferType] = (byType[t.transferType]||0)+1 );
  const completedRepairs = tr.filter(t=>t.transferType==='repair' && t.entryDate && t.exitDate);
  function avgDuration(list){
    if(!list.length) return null;
    const total = list.reduce((s,t)=>s+daysBetween(t.entryDate,t.exitDate),0);
    return (total/list.length).toFixed(1);
  }
  const capitalDur = avgDuration(completedRepairs.filter(t=>t.toLocationType==='workshop_capital'));
  const suezDur = avgDuration(completedRepairs.filter(t=>t.toLocationType==='workshop_suez'));
  const currentlyInWorkshop = eq.filter(e=>e.locationType && e.locationType.startsWith('workshop'));
  const byProjectCount = {};
  eq.forEach(e=>{ byProjectCount[e.project] = (byProjectCount[e.project]||0)+1; });
  const topMoved = eq.slice().sort((a,b)=>(b.transferCount||0)-(a.transferCount||0)).slice(0,10).filter(e=>e.transferCount>0);

  // إجمالي أيام التعطل لكل معدة (كل عمليات الإصلاح المكتملة أو الجارية)
  const downtimeMap = {};
  tr.filter(t=>t.transferType==='repair' && (t.entryDate||t.approvedAt)).forEach(t=>{
    const days = daysBetween(t.entryDate||t.approvedAt, t.exitDate||null);
    downtimeMap[t.equipmentCode] = (downtimeMap[t.equipmentCode]||0) + (days||0);
  });
  const topDowntime = Object.entries(downtimeMap).sort((a,b)=>b[1]-a[1]).slice(0,10)
    .map(([code,days])=>({code, name:(equipmentMap[code]||{}).name || code, days}));

  // اتجاه النقل الشهري (آخر 12 شهراً)
  const months = [];

    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label: d.toLocaleDateString('ar-EG',{month:'short',year:'2-digit'})});
  }
  const monthlyCounts = months.map(m=> tr.filter(t=>t.requestedAt && t.requestedAt.slice(0,7)===m.key).length );

  // أكثر المشاريع مصدراً لطلبات النقل
  const fromCounts = {};

  const topFrom = Object.entries(fromCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // تقرير حوافز الورشة: تجميع العمالة حسب اسم الفني
  const workerStats = {};

    (t.labor||[]).forEach(x=>{

      workerStats[key].role = x.role || workerStats[key].role;
      workerStats[key].repairs.add(t.id);
      workerStats[key].hours += parseFloat(x.hours)||0;
      workerStats[key].cost += costLine(x.hours,x.rate);
    });

  const workerRows = Object.entries(workerStats).map(([name,s])=>({name, role:s.role, repairs:s.repairs.size, hours:s.hours, cost:s.cost})).sort((a,b)=>b.cost-a.cost);

  <div class="card">

    ${workerRows.map(w=>`<tr><td>${esc(w.name)}</td><td>${esc(w.role)||'—'}</td><td>${w.repairs}</td><td>${w.hours}</td><td>${w.cost.toLocaleString()}</td></tr>`).join('')}

      <div style="max-height:260px;"><canvas id="chartTypes"></canvas></div>

      <div style="max-height:260px;"><canvas id="chartTopProjects"></canvas></div>

  <div class="card">

    ${currentlyInWorkshop.map(e=>{
      const activeTr = tr.find(t=>t.equipmentCode===e.code && t.status==='in_workshop');
      const days = activeTr ? daysBetween(activeTr.entryDate||activeTr.approvedAt) : '—';
      return `<tr><td>${esc(e.code)}</td><td>${esc(e.name)}</td><td>${esc(e.project)}</td><td>${days}</td></tr>`;
    }).join('') || '<tr><td colspan="4" class="empty">لا توجد معدات في الورش حالياً</td></tr>'}
    </tbody></table></div>
  </div>
  <div class="card">
    <h3>أكثر المعدات تعطلاً بسبب الإصلاح (إجمالي الأيام)</h3>
    ${topDowntime.length? topDowntime.map(d=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:6px 0;"><span>${esc(d.name)} (${esc(d.code)})</span><b>${d.days} يوم</b></div>`).join('') : '<div class="empty">لا توجد بيانات كافية بعد</div>'}

function exportReportExcel(){
  const eq = equipList(); const tr = transferList();
  const byProjectCount = {};
  eq.forEach(e=>{ byProjectCount[e.project] = (byProjectCount[e.project]||0)+1; });
  const workerStats = {};
  tr.forEach(t=>{
    (t.labor||[]).forEach(x=>{
      if(!x.name) return;
      const key = x.name.trim();
      if(!workerStats[key]) workerStats[key] = {role:x.role||'', repairs:new Set(), hours:0, cost:0};
      workerStats[key].role = x.role || workerStats[key].role;
      workerStats[key].repairs.add(t.id);
      workerStats[key].hours += parseFloat(x.hours)||0;
      workerStats[key].cost += costLine(x.hours,x.rate);
    });
  });
  const wb = XLSX.utils.book_new();
  const eqSheet = eq.map(e=>({الكود:e.code, الاسم:e.name, الماركة:e.brand, الموديل:e.model, الموقع:e.project, الحالة:e.status, 'عدد مرات النقل':e.transferCount||0}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(eqSheet), 'المعدات');
  const trSheet = tr.map(t=>({الكود:t.equipmentCode, الاسم:t.equipmentName, النوع:typeLabel(t.transferType), من:t.fromLocation, إلى:t.toLocation, الحالة:t.status, بواسطة:t.requestedBy, التاريخ:fmtDate(t.requestedAt)}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(trSheet), 'طلبات النقل');
  const distSheet = Object.entries(byProjectCount).sort((a,b)=>b[1]-a[1]).map(([p,c])=>({الموقع:p, 'عدد المعدات':c}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(distSheet), 'توزيع المواقع');
  const workerSheet = Object.entries(workerStats).map(([name,s])=>({'اسم الفني':name, الوظيفة:s.role, 'عدد الإصلاحات':s.repairs.size, 'إجمالي الساعات':s.hours, 'إجمالي التكلفة':s.cost})).sort((a,b)=>b['إجمالي التكلفة']-a['إجمالي التكلفة']);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(workerSheet), 'حوافز الورشة');
  XLSX.writeFile(wb, 'تقرير_نظام_المعدات_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

// ---------- EXCEL IMPORT ----------
let pendingImportRows = null;
function findHeaderRow(rows){
  for(let r=0;r<Math.min(rows.length,15);r++){
    const row = rows[r]||[];
    if(row.some(c=>String(c||'').trim()==='Equipment Code')) return r;
  }
  return -1;
}
function handleImportFile(){
  const input = document.getElementById('importFile');
  const file = input.files[0];
  const prevBox = document.getElementById('importPreview');
  if(!file){ alert('يرجى اختيار ملف أولاً'); return; }
  prevBox.innerHTML = '<div class="muted" style="margin-top:10px;">جارِ قراءة الملف...</div>';
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
      const hIdx = findHeaderRow(rows);
      if(hIdx===-1){ prevBox.innerHTML = '<div class="muted" style="color:var(--danger);margin-top:10px;">تعذر التعرف على تنسيق الملف (لم يتم إيجاد عمود "Equipment Code").</div>'; return; }
      const headers = rows[hIdx].map(h=>String(h||'').trim());
      const col = (name)=>headers.indexOf(name);
      const idx = {
        code: col('Equipment Code'), name: col('Equipment Name'), brand: col('Equipment Type'),
        model: col('Equipment Model'), category: col('Plant Type'), year: col('Manfacture Year'),
        license: col('License No.'), project: col('Project Name'), status: col('Status'),
        chassis: col('Chaiss No.'), eng: col('Eng No.'), driver: col('Driver Name')
      };
      const g = (row, key)=> idx[key]>-1 ? String(row[idx[key]]||'').trim() : '';
      const out = [];
      for(let r=hIdx+1; r<rows.length; r++){
        const row = rows[r]; if(!row) continue;
        const code = g(row,'code'), name = g(row,'name');
        if(!code && !name) continue;
        out.push({
          code: code || ('NOCODE-'+r), name, brand:g(row,'brand'), model:g(row,'model'),
          category:g(row,'category'), year:g(row,'year'), license:g(row,'license'),
          project:g(row,'project') || 'غير محدد', status:g(row,'status') || 'Working',
          chassis:g(row,'chassis'), eng:g(row,'eng'), driver:g(row,'driver')
        });
      }
      pendingImportRows = out;
      const newProjects = Array.from(new Set(out.map(r=>r.project))).filter(p=>p && !allLoginLocations().includes(p) && locType(p)==='project');
      prevBox.innerHTML = `
        <div class="card" style="background:var(--surface-2);margin-top:10px;">
          <div><b>${out.length}</b> معدة تم العثور عليها في الملف وجاهزة للاستيراد.</div>
          ${newProjects.length? `<div class="muted" style="margin-top:6px;">مشاريع جديدة سيتم إضافتها تلقائياً: ${newProjects.map(esc).join('، ')}</div>` : ''}
          <div style="margin-top:10px;"><button onclick="confirmImport()">✅ تأكيد الاستيراد الآن</button></div>
        </div>`;
    }catch(err){
      console.error(err);
      prevBox.innerHTML = '<div class="muted" style="color:var(--danger);margin-top:10px;">حدث خطأ أثناء قراءة الملف: '+err.message+'</div>';
    }
  };
  reader.readAsArrayBuffer(file);
}
async function confirmImport(){
  if(!pendingImportRows || !pendingImportRows.length){ alert('لا توجد بيانات جاهزة للاستيراد'); return; }
  const prevBox = document.getElementById('importPreview');
  prevBox.innerHTML = '<div class="muted" style="margin-top:10px;">جارِ الاستيراد... قد يستغرق دقيقة حسب عدد المعدات.</div>';
  try{
    const rows = pendingImportRows.map(item=>({
      code:item.code, name:item.name, brand:item.brand, model:item.model, category:item.category,
      year:item.year, license:item.license, project:item.project, location_type: locType(item.project),
      status:item.status, chassis:item.chassis, eng:item.eng, driver:item.driver
    }));
    for(let i=0;i<rows.length;i+=200){
      const chunk = rows.slice(i,i+200);
      const {error} = await sb.from('equipment').upsert(chunk, {onConflict:'code'});
      if(error) throw error;
    }
    const newProjects = Array.from(new Set(rows.map(r=>r.project))).filter(p=>p && locType(p)==='project');
    if(newProjects.length){
      await sb.from('projects').upsert(newProjects.map(name=>({name})), {onConflict:'name'});
    }
    pendingImportRows = null;
    await fetchAll();
    prevBox.innerHTML = '<div class="muted" style="color:var(--ok);margin-top:10px;">✅ تم الاستيراد بنجاح.</div>';
    render();
  }catch(err){
    console.error(err);
    prevBox.innerHTML = '<div class="muted" style="color:var(--danger);margin-top:10px;">حدث خطأ أثناء الاستيراد: '+err.message+'</div>';
  }
}

async function addEquipment(){

  const project = document.getElementById('addProject').value;
  const payload = {
    code, name,
    brand: document.getElementById('addBrand').value.trim(),
    model: document.getElementById('addModel').value.trim(),
    year: document.getElementById('addYear').value.trim(),
    license: document.getElementById('addLicense').value.trim(),
    project, location_type: locType(project),
    status: document.getElementById('addStatus').value,
    chassis: document.getElementById('addChassis').value.trim(),
    eng: document.getElementById('addEng').value.trim(),
    driver: document.getElementById('addDriver').value.trim(),
    transfer_count: 0
  };
  const {error} = await sb.from('equipment').insert(payload);
  if(error){ alert('حدث خطأ: '+error.message+ (error.message.includes('duplicate')?' (كود المعدة مستخدم من قبل)':'')); return; }
  alert('تمت إضافة المعدة بنجاح');
  await fetchAll(); render();
}

async function saveEditEquipment(code, btn){
  const patch = {
    name: document.getElementById('editName').value.trim(),
    brand: document.getElementById('editBrand').value.trim(),
    model: document.getElementById('editModel').value.trim(),
    year: document.getElementById('editYear').value.trim(),
    project: document.getElementById('editProject').value,
    location_type: locType(document.getElementById('editProject').value),
    status: document.getElementById('editStatus').value,
    chassis: document.getElementById('editChassis').value.trim(),
    eng: document.getElementById('editEng').value.trim(),
    driver: document.getElementById('editDriver').value.trim()
  };
  const {error} = await sb.from('equipment').update(patch).eq('code', code);
  if(error){ alert('حدث خطأ: '+error.message); return; }
  btn.closest('.modal-bg').remove();
  await fetchAll(); render();
}
async function deleteEquipment(code){
  if(!confirm('هل أنت متأكد من حذف هذه المعدة نهائياً؟ لا يمكن التراجع عن هذا الإجراء.')) return;
  const {error} = await sb.from('equipment').delete().eq('code', code);
  if(error){
    if(error.message.includes('foreign key') || error.message.includes('violates')){
      alert('لا يمكن حذف هذه المعدة لأن لها سجل نقل سابق مرتبط بها. يمكنك بدلاً من ذلك تغيير حالتها إلى "Scrap" من زر تعديل.');
    } else alert('حدث خطأ: '+error.message);
    return;
  }
  await fetchAll(); render();
}
async function addProject(){
  const name = document.getElementById('newProjName').value.trim();
  if(!name){ alert('يرجى كتابة اسم المشروع'); return; }
  const {error} = await sb.from('projects').upsert({name}, {onConflict:'name'});
  if(error){ alert('حدث خطأ: '+error.message); return; }
  document.getElementById('newProjName').value='';
  await fetchAll(); render();
}
async function deleteProject(name){
  if(!confirm('حذف "'+name+'" من قائمة المشاريع؟')) return;
  const {error} = await sb.from('projects').delete().eq('name', name);
  if(error){ alert('حدث خطأ: '+error.message); return; }
  await fetchAll(); render();
}

// ---------- HANDLERS ----------
function attachHandlers(){
  renderNotifBell();
  if(currentTab==='reports'){ setTimeout(initReportCharts, 0); } else { destroyCharts(); }
  document.querySelectorAll('[id^="laborRows_"]').forEach(el=>{
    const id = el.id.replace('laborRows_','');
    if(transfersMap[id]){ ensureWorkState(transfersMap[id]); renderLaborRows(id); renderPartsRows(id); }
  });
  const eqSearch = document.getElementById('eqSearch');
  if(eqSearch){
    fillEquipmentTable();
    ['eqSearch','eqProjFilter','eqStatusFilter'].forEach(id=>{
      document.getElementById(id).addEventListener('input', fillEquipmentTable);
      document.getElementById(id).addEventListener('change', fillEquipmentTable);
    });
  }
  const ntType = document.getElementById('ntType');
  if(ntType){
    const destWrap = document.getElementById('ntDestWrap');
    function refresh(){
      destWrap.innerHTML = renderDestOptions(ntType.value);
      document.getElementById('ntPermanentWrap').style.display = ntType.value==='permanent' ? '' : 'none';
      document.getElementById('ntRepairWrap').style.display = ntType.value==='repair' ? '' : 'none';
      const destSel = document.getElementById('ntDest');
      if(destSel && ntType.value==='repair'){
        destSel.addEventListener('change', ()=>{
          document.getElementById('ntExternalWrap').style.display = destSel.value==='__external__' ? '' : 'none';
        });
      }
    }
    refresh();
    ntType.addEventListener('change', refresh);
    document.getElementById('ntPhoto').addEventListener('change', (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const url = URL.createObjectURL(f);
      document.getElementById('ntPhotoPrev').innerHTML = `<img class="imgprev" src="${url}">`;
    });
    document.getElementById('ntSubmit').addEventListener('click', submitNewTransfer);
  }
  const trTabs = document.getElementById('trFilterTabs');
  if(trTabs){
    trTabs.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        trTabs.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        let list = transferList();
        if(currentUser.role==='project') list = list.filter(t=>t.fromLocation===currentUser.name || t.toLocation===currentUser.name);
        if(b.dataset.f!=='all') list = list.filter(t=>t.status===b.dataset.f);
        document.getElementById('trList').innerHTML = renderTransferCards(list);
      });
    });
  }
}

async function submitNewTransfer(){
  if(uploadingFlag) return;
  const eqCode = document.getElementById('ntEquip').value;
  const type = document.getElementById('ntType').value;
  const destSel = document.getElementById('ntDest');
  let dest = destSel ? destSel.value : '';
  const maintDate = document.getElementById('ntMaintDate').value;
  const meter = document.getElementById('ntMeter').value.trim();
  const filter = document.getElementById('ntFilter').value.trim();
  const accessories = document.getElementById('ntAccessories').value.trim();

  if(!eqCode){ alert('يرجى اختيار المعدة'); return; }
  if(!dest || dest===''){ alert('يرجى اختيار وجهة النقل'); return; }
  if(dest==='__external__'){
    const extName = document.getElementById('ntExternalName').value.trim();
    if(!extName){ alert('يرجى كتابة اسم الورشة الخارجية'); return; }
    dest = extName;
  }
  if(!maintDate || !meter || !filter || !accessories){
    alert('يرجى استكمال جميع البيانات الإلزامية: تاريخ الصيانة، العداد، آخر فلتر، مشتملات المعدة'); return;
  }
  let parts = '';
  if(type==='permanent'){
    parts = document.getElementById('ntParts').value.trim();
    if(!parts){ alert('في حالة النقل الدائم يجب ذكر قطع الغيار والفلاتر المرسلة مع المعدة'); return; }
  }
  const eq = equipmentMap[eqCode];
  const destType = type==='repair' ? locType(dest) : 'project';

  const payload = {
    equipment_code: eq.code, equipment_name: eq.name,
    transfer_type: type,
    from_location: eq.project, from_location_type: eq.locationType,
    to_location: dest, to_location_type: destType,
    last_maintenance_date: maintDate, last_maintenance_meter: meter, last_filter_changed: filter, accessories,
    parts_and_spares: parts,
    requested_by: currentUser.name, status:'pending'
  };
  if(type==='mission'){ payload.mission_end_date = document.getElementById('ntMissionEnd')?.value || ''; }

  uploadingFlag = true;
  const btn = document.getElementById('ntSubmit'); btn.disabled = true; btn.textContent = 'جارِ الإرسال...';
  try{
    if(type==='repair'){
      const inspFile = document.getElementById('ntInspection').files[0];
      if(!inspFile){ alert('نموذج الفحص الفني إلزامي عند النقل للإصلاح'); uploadingFlag=false; btn.disabled=false; btn.textContent='إرسال طلب النقل للاعتماد'; return; }
      const url = await uploadFile(inspFile, 'inspection');
      payload.inspection_form_url = url;
    }
    const photoFile = document.getElementById('ntPhoto').files[0];
    if(photoFile){
      const url2 = await uploadFile(photoFile, 'photos');
      payload.photo_url = url2;
    }
    const {error} = await sb.from('transfers').insert(payload);
    if(error) throw error;
    try{
      sendAdminEmail(
        `طلب نقل جديد: ${eq.name} (${eq.code})`,
        `تم إنشاء طلب نقل جديد يحتاج موافقتكم.\n\nالمعدة: ${eq.name} (${eq.code})\nنوع النقل: ${typeLabel(type)}\nمن: ${eq.project}\nإلى: ${dest}\nبواسطة: ${currentUser.name}\n\nيرجى الدخول للنظام لمراجعة الطلب واعتماده أو رفضه.`
      );
    }catch(mailErr){ console.warn('email notify failed (ignored)', mailErr); }
    alert('تم إرسال طلب النقل بنجاح، بانتظار موافقة الإدارة.');
    await fetchAll();
    setTab('transfers');
  }catch(e){
    console.error(e); alert('حدث خطأ أثناء إرسال الطلب: '+(e.message||''));
  }finally{
    uploadingFlag=false;
  }
}
